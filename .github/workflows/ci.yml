name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    # the runner has no GPU: render in software so window captures work
    env:
      BROWNOUT_DISABLE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run make-demo
      - run: npm run check
      - run: npm run bench
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - run: npm run smoke
      - run: npm run uitest -- --no-build
