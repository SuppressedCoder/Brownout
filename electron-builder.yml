appId: org.frc.brownout
productName: Brownout
copyright: Brownout contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - ext: wpilog
    name: WPILib data log
    description: WPILib data log
    role: Viewer
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Brownout
portable:
  artifactName: Brownout-${version}-portable.exe
mac:
  target: [dmg, zip]
  icon: build/icon.png
  category: public.app-category.developer-tools
linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Development
publish: null
