appId: org.frc.brownout
productName: Brownout
copyright: Brownout contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
fileAssociations:
  - ext: wpilog
    name: WPILib data log
    description: WPILib data log
    role: Viewer
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
nsis:
  artifactName: Brownout-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Brownout
portable:
  artifactName: Brownout-${version}-portable.exe
mac:
  # Apple silicon and Intel Macs each get their own download
  artifactName: Brownout-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.developer-tools
linux:
  target: [AppImage, deb]
  # .deb packages must name a maintainer; this is the author's public GitHub no-reply address
  maintainer: RoboticsIsEpik <102563278+SuppressedCoder@users.noreply.github.com>
  icon: build/icon.png
  category: Development
publish: null
